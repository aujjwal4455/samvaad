<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Nitya</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%231C1C1E'/%3E%3Ccircle cx='32' cy='32' r='12' fill='%23E8760C'/%3E%3C/svg%3E">
<script>
try{var t=JSON.parse(localStorage.getItem('samvaad.v3')||'{}').theme;var d=t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.dataset.theme=d?'dark':'light'}catch(e){document.documentElement.dataset.theme='light'}
</script>
<style>
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --bg:#F6F5F1;--surface:#fff;--ink:#1C1C1E;--ink2:#68686D;--ink3:#8E8E93;
  --line:rgba(60,60,67,.16);--fill:rgba(118,118,128,.12);
  --orange:#E8760C;--orange-soft:#FDEBD7;--orange-ink:#9A4E06;
  --green:#0B8A5F;--green-soft:#DDF3EA;--coral:#C9503F;--coral-soft:#FAE3DF;
  --c1:#E8760C;--c1s:#FDEBD7;--c1i:#9A4E06;
  --c2:#2F6FDE;--c2s:#E1EBFC;--c2i:#1F4FA8;
  --c3:#0B8A5F;--c3s:#DDF3EA;--c3i:#0A6B4A;
  --c4:#8A4FD6;--c4s:#EEE3FA;--c4i:#5E32A3;
  --bar:rgba(246,245,241,.8);
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
  --tabh:calc(56px + env(safe-area-inset-bottom,0px));
  --fbar:calc(60px + env(safe-area-inset-top,0px));
  --ease:cubic-bezier(.32,.72,0,1);
}
:root[data-theme="dark"]{
  --bg:#0E0E10;--surface:#1C1C1E;--ink:#F5F5F7;--ink2:#A0A0A8;--ink3:#8E8E93;
  --line:rgba(255,255,255,.14);--fill:rgba(118,118,128,.24);
  --orange:#FF9F43;--orange-soft:rgba(255,159,67,.16);--orange-ink:#FFB468;
  --green:#34C48D;--green-soft:rgba(52,196,141,.16);--coral:#FF7A6B;--coral-soft:rgba(255,122,107,.16);
  --c1:#FF9F43;--c1s:rgba(255,159,67,.16);--c1i:#FFB468;
  --c2:#6FA3FF;--c2s:rgba(111,163,255,.16);--c2i:#9DBFFF;
  --c3:#34C48D;--c3s:rgba(52,196,141,.16);--c3i:#5FD9A8;
  --c4:#B58CFF;--c4s:rgba(181,140,255,.16);--c4i:#CBAEFF;
  --bar:rgba(14,14,16,.8);
}
.p0{--pc:var(--ink3);--pcs:var(--fill);--pci:var(--ink2)}
.p1{--pc:var(--c1);--pcs:var(--c1s);--pci:var(--c1i)}
.p2{--pc:var(--c2);--pcs:var(--c2s);--pci:var(--c2i)}
.p3{--pc:var(--c3);--pcs:var(--c3s);--pci:var(--c3i)}
.p4{--pc:var(--c4);--pcs:var(--c4s);--pci:var(--c4i)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg)}
body{font:17px/1.4 var(--font);color:var(--ink);-webkit-font-smoothing:antialiased;overscroll-behavior:none;-webkit-text-size-adjust:100%}
@media(min-width:520px){body{background:#E7E6E1}:root[data-theme="dark"] body{background:#000}#shell{box-shadow:0 0 0 .5px var(--line)}}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
h1,h2,h3,h4,p{margin:0}
svg{display:block;flex:none}

#shell{position:fixed;inset:0;max-width:480px;margin:0 auto;background:var(--bg);overflow:hidden;overflow:clip}
#scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;scroll-padding-top:var(--fbar)}
#scroll.feed{scroll-snap-type:y mandatory}
.page{padding:calc(var(--safe-t) + 10px) 20px calc(var(--tabh) + 32px)}

/* tab bar */
#tabs{position:absolute;left:0;right:0;bottom:0;height:var(--tabh);padding-bottom:var(--safe-b);display:flex;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);border-top:.5px solid var(--line);z-index:10}
#tabs[hidden]{display:none}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:0;background:none;color:var(--ink3);font-size:10.5px;font-weight:500;letter-spacing:.01em;min-height:56px;transition:color .2s}
#tabs button[aria-current="page"]{color:var(--ink)}
#tabs button[aria-current="page"] svg{color:var(--orange);stroke-width:2.1}
#tabs .ti{position:relative;display:block}
#tabs .bdg{position:absolute;top:-6px;right:-14px;min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:var(--orange);color:#fff;font:700 10px/16px var(--font);font-style:normal;text-align:center;box-shadow:0 0 0 2px var(--bg)}

/* headings */
.hdr{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 0 20px}
.hdr .date{color:var(--ink2);font-size:15px;margin-bottom:2px}
.hdr .right{display:flex;align-items:center;gap:4px}
.large{font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.035em}
.lead{color:var(--ink2);font-size:16px;line-height:1.45;margin:-10px 0 22px;max-width:36ch}
.sec{font-size:22px;font-weight:700;letter-spacing:-.025em;margin:32px 0 12px}
.sec.sm{font-size:20px}

/* controls */
.btn{min-height:50px;padding:0 20px;border-radius:16px;border:0;font-weight:600;font-size:17px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s,opacity .2s,background .2s}
.btn:active{transform:scale(.97)}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn.soft{background:var(--fill);color:var(--ink)}
.btn.quiet{background:none;color:var(--ink2);padding:0 12px;font-weight:500}
.btn.sm{min-height:44px;font-size:15px;padding:0 14px;border-radius:12px}
.btn.xs{min-height:36px;font-size:14px;padding:0 14px;border-radius:11px}
.btn.danger{color:var(--coral)}
.btn.red{background:var(--coral);color:#fff}
.btn.wide{width:100%}
.btn[disabled]{opacity:.35;pointer-events:none}
.ibtn{width:44px;height:44px;border:0;border-radius:50%;background:none;display:grid;place-items:center;position:relative;color:var(--ink)}
.ibtn:active{background:var(--fill)}
.group{background:var(--surface);border-radius:20px;overflow:hidden}
.group>*+*{border-top:.5px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 16px;width:100%;border:0;background:none;text-align:left}
button.row:active{background:var(--fill)}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600;font-size:17px;line-height:1.25;overflow-wrap:anywhere}
.row .s{color:var(--ink2);font-size:14px;margin-top:1px}
.row .s.one{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .chev{color:var(--ink3)}
.chipic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--tbg,var(--fill));color:var(--tc,var(--ink2));flex:none}
.srow{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;padding:0 16px}
.srow .val{display:flex;align-items:center;gap:2px;color:var(--ink2);min-width:0;max-width:62%}
.srow .val span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow select{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;cursor:pointer}
.sw{width:51px;height:31px;border-radius:99px;background:var(--fill);position:relative;flex:none;transition:background .25s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:transform .3s var(--ease)}
[aria-checked="true"] .sw{background:var(--green)}
[aria-checked="true"] .sw::after{transform:translateX(20px)}
.pill{display:inline-flex;align-items:center;padding:4px 10px;border-radius:99px;font-size:13px;font-weight:600;background:var(--fill);color:var(--ink2);white-space:nowrap}
.pill.green{background:var(--green-soft);color:var(--green)}
.pill.orange{background:var(--orange-soft);color:var(--orange-ink)}
.pill.red{background:var(--coral-soft);color:var(--coral)}
.pill.paper{background:var(--pcs);color:var(--pci)}
.qmeta{display:inline-flex;align-items:center;gap:5px;width:max-content;max-width:100%;margin:12px 0 4px;padding:5px 10px;border-radius:99px;background:var(--orange-soft);color:var(--orange-ink);font-size:12px;font-weight:750;letter-spacing:.025em;text-transform:uppercase}
.qmeta .qdot{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.65}
.qcount{font-size:12px;color:var(--ink3);font-weight:600;margin-top:5px}
.note{color:var(--ink2);font-size:14px;line-height:1.45;margin-top:10px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 22px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 22px),transparent);padding-right:22px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 14px;border-radius:99px;border:0;background:var(--fill);color:var(--ink2);font-size:15px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;transition:background .2s,color .2s,transform .15s}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--ink);color:var(--bg)}
.seg{display:flex;background:var(--fill);border-radius:13px;padding:3px;margin-bottom:22px}
.seg button{flex:1;height:36px;border:0;border-radius:10px;background:none;color:var(--ink2);font-size:15px;font-weight:600;transition:background .25s,color .25s}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.search{flex:1;display:flex;align-items:center;gap:8px;height:44px;padding:0 12px;border-radius:13px;background:var(--fill);color:var(--ink2)}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:17px;color:var(--ink)}
.search input::placeholder{color:var(--ink3)}
.search:focus-within{box-shadow:0 0 0 2px var(--orange)}

/* home */
.streak{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 13px 0 11px;border-radius:99px;background:var(--surface);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;color:var(--ink3)}
.streak.on{color:var(--ink)}
.streak.on svg{color:var(--orange);fill:var(--orange-soft)}
.goal{background:var(--surface);border-radius:28px;padding:20px}
.goalrow{display:flex;align-items:center;gap:18px}
.ring{position:relative;width:96px;height:96px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .bg{stroke:var(--fill)}
.ring .fg{stroke:var(--orange);transition:stroke-dashoffset 1.1s var(--ease),stroke .4s}
.goal.done .ring .fg{stroke:var(--green)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:32px;font-weight:700;letter-spacing:-.03em}
.gtext{border:0;background:none;padding:0;text-align:left;display:block;min-width:0}
.gtitle{font-size:20px;font-weight:700;letter-spacing:-.02em;display:flex;align-items:center;gap:2px}
.gtitle svg{color:var(--ink3)}
.gsub{color:var(--ink2);font-size:15px;margin-top:2px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:20px 0}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--ink3)}
.day i{width:100%;max-width:36px;aspect-ratio:1;border-radius:50%;background:var(--fill);display:grid;place-items:center;color:#fff}
.day.done i{background:var(--green)}
.day.today i{box-shadow:inset 0 0 0 2px var(--orange)}
.day.today.done i{box-shadow:none}
.day.today{color:var(--ink)}
.kotd{display:block;position:relative;overflow:hidden;width:100%;text-align:left;border:0;background:var(--surface);border-radius:26px;padding:20px}
.kotd::before{content:"";position:absolute;inset:0;background:radial-gradient(90% 90% at 100% 0%,color-mix(in srgb,var(--pc) 16%,transparent),transparent 70%);pointer-events:none}
.kotd>*{position:relative}
.kotd:active{transform:scale(.99)}
.kotd h3{font-size:27px;line-height:1.12;font-weight:700;letter-spacing:-.03em;margin:14px 0 8px;text-wrap:balance}
.kotd p{color:var(--ink2);font-size:16px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.kotd .km{display:flex;align-items:center;justify-content:space-between;margin-top:16px;color:var(--ink3);font-size:14px}
.kotd .go{color:var(--pci);font-weight:600;display:inline-flex;align-items:center;gap:2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);padding:18px 8px;text-align:center}
.stats b{display:block;font-size:28px;font-weight:700;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums}
.stats span{color:var(--ink2);font-size:13px}
.rec3{display:grid;grid-template-columns:repeat(3,1fr);padding:18px 8px 14px;text-align:center}
.rec3 b{display:block;font-size:28px;font-weight:700;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums}
.rec3 span{color:var(--ink2);font-size:13px;display:block;margin-top:2px}
.rec3 .star{color:var(--orange);display:inline-flex;vertical-align:-3px;margin-right:3px}
.nudge{margin:0 16px 14px;padding:12px 14px;border-radius:14px;background:var(--orange-soft);color:var(--orange-ink);font-size:15px;font-weight:600;line-height:1.35}
.nudge.win{background:var(--green-soft);color:var(--green)}
.mrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 16px;border-top:.5px solid var(--line)}
.mrow .l{font-size:16px}.mrow .l small{display:block;color:var(--ink3);font-size:13px}
.mrow .v{flex:none;white-space:nowrap;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;text-align:right}
.delta{display:block;font-size:12.5px;font-weight:600;letter-spacing:0}
.delta.up{color:var(--green)}.delta.dn{color:var(--coral)}.delta.eq{color:var(--ink3)}
.hist{padding:14px 16px 16px;border-top:.5px solid var(--line)}
.hist .cap{display:flex;justify-content:space-between;color:var(--ink3);font-size:12.5px;margin-bottom:8px}
.hbars{position:relative;display:flex;align-items:flex-end;gap:4px;height:84px}
.hbars i{flex:1;min-width:0;border-radius:4px 4px 2px 2px;background:var(--fill);min-height:3px}
.hbars i.hit{background:var(--orange)}.hbars i.top{background:var(--green)}.hbars i.td{outline:2px solid var(--ink3);outline-offset:1px}
.hbars .goalln{position:absolute;left:0;right:0;border-top:1.5px dashed var(--ink3);opacity:.55;pointer-events:none}
.heat{padding:14px 16px 16px}
.heat .seg{margin-bottom:14px}
.hgrid{display:grid;gap:3px}
.hgrid.y{grid-template-rows:repeat(7,11px);grid-auto-flow:column;gap:2px}
.hgrid.y .hc{aspect-ratio:auto;width:11px;height:11px}
.hscroll{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:3px 2px}
.hscroll::-webkit-scrollbar{display:none}
.hmon{height:14px}
.hgrid.m{grid-template-columns:repeat(7,1fr)}
.hgrid.w{grid-template-columns:repeat(7,1fr);gap:6px}
.hc{border:0;padding:0;border-radius:3px;background:var(--fill);aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink);font-size:12px;font-weight:600;line-height:1.15;min-width:0}
.hgrid.y .hc{border-radius:2px}
.hgrid.m .hc,.hgrid.w .hc{border-radius:8px}
.hgrid.w .hc{aspect-ratio:auto;height:64px;font-size:19px}
.hc small{font-size:10.5px;font-weight:500;opacity:.75}
.hc.h1{background:color-mix(in srgb,var(--orange) 28%,transparent)}
.hc.h2{background:color-mix(in srgb,var(--orange) 50%,transparent)}
.hc.h3{background:color-mix(in srgb,var(--orange) 75%,transparent)}
.hc.h4{background:var(--orange);color:#fff}
.hc.h3{color:var(--ink)}
.hc.td{outline:2px solid var(--ink);outline-offset:1px}
.hc.sel{outline:2px solid var(--blue,#2F6FDE);outline-offset:1px}
.hc.e{background:none;pointer-events:none}
.hmon{display:grid;grid-auto-flow:column;gap:2px;margin-bottom:5px;font-size:10px;color:var(--ink3);height:12px}
.hmon span{white-space:nowrap;overflow:visible}
.hleg{display:flex;align-items:center;justify-content:flex-end;gap:4px;margin-top:10px;color:var(--ink3);font-size:12px}
.hleg i{width:11px;height:11px;border-radius:3px;background:var(--fill)}
.hleg i.h1{background:color-mix(in srgb,var(--orange) 28%,transparent)}.hleg i.h2{background:color-mix(in srgb,var(--orange) 50%,transparent)}.hleg i.h3{background:color-mix(in srgb,var(--orange) 75%,transparent)}.hleg i.h4{background:var(--orange)}
.hcap{min-height:20px;margin-top:10px;font-size:14px;color:var(--ink2)}
.hcap b{color:var(--ink)}
.covtop{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pd{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--pc);margin-right:9px}
.bar{display:flex;height:6px;border-radius:3px;background:var(--fill);overflow:hidden;margin-top:10px}
.bar .m{background:var(--green)}.bar .l{background:var(--orange)}
.cov{padding-top:14px;padding-bottom:14px}

/* feed */
.fbar{position:sticky;top:0;z-index:5;height:var(--fbar);padding:calc(var(--safe-t) + 8px) 12px 8px 16px;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px)}
.frow{display:flex;gap:2px;align-items:center;height:44px}
.frow .chips{flex:1;min-width:0}
.fprog{position:absolute;left:0;right:0;bottom:0;height:2px;background:transparent}
.fprog b{display:block;height:100%;width:0;background:var(--orange);border-radius:0 2px 2px 0;transition:width .45s var(--ease)}
.dot{position:absolute;top:9px;right:9px;width:9px;height:9px;border-radius:50%;background:var(--orange);box-shadow:0 0 0 2px var(--bg)}
.dot[hidden]{display:none}
.fcard{position:relative;min-height:calc(100vh - var(--fbar));min-height:calc(100dvh - var(--fbar));padding:22px 20px calc(var(--tabh) + 14px);display:flex;flex-direction:column;scroll-snap-align:start;background:radial-gradient(120% 46% at 50% 0%,color-mix(in srgb,var(--pc) 11%,transparent),transparent 72%)}
.fcard+.fcard{border-top:.5px solid var(--line)}
.ftop{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ftop .l{display:flex;align-items:center;gap:8px}
.tag{padding:5px 11px;border-radius:99px;background:var(--pcs);color:var(--pci);font-size:13px;font-weight:600}
.rd{display:inline-flex;align-items:center;gap:3px;color:var(--ink3);font-size:13px;font-weight:500}
.rd[hidden]{display:none}
.pos{color:var(--ink3);font-size:14px;font-variant-numeric:tabular-nums}
.ftitle{font-size:36px;line-height:1.08;font-weight:700;letter-spacing:-.037em;margin:22px 0 10px;text-wrap:balance;overflow-wrap:anywhere}
.fcrumb{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:26px}
.fcrumb button{border:0;background:var(--fill);color:var(--ink2);border-radius:99px;min-height:32px;padding:0 12px;font-size:14px;font-weight:500}
.fcrumb button:active{background:var(--line)}
.pts{list-style:none;margin:0 0 30px;padding:0;display:grid;gap:16px}
.pts li{position:relative;padding-left:20px;font-size:17px;line-height:1.5}
.pts li::before{content:"";position:absolute;left:2px;top:.63em;width:6px;height:6px;border-radius:50%;background:var(--pc,var(--green))}
.exp .pts li::before{background:var(--green)}
.factions{margin-top:auto;display:flex;gap:10px}
.factions .dark{flex:1}
.factions .btn.on{background:var(--orange-soft);color:var(--orange-ink)}
.btn.on svg{fill:currentColor}
.btn.sq50{width:50px;padding:0}
.nextcue{align-self:center;margin-top:12px;width:44px;height:44px;border:0;background:none;color:var(--ink3);display:grid;place-items:center;border-radius:50%}

function renderFeedList(){
 const l=$('#feedlist');if(!l)return;
 l.innerHTML=feedInner(feedList=feedItems());$('#scroll').scrollTop=0;

 const p=$('#fprogb');if(p)p.style.width='0';

function setupFeed(){
 if(io){io.disconnect();io=null}if(ioIn){ioIn.disconnect();ioIn=null}
 clearTimeout(dwellT);
 const sc=$('#scroll');
 if(tab!=='learn'||session||!('IntersectionObserver' in window)){sc.classList.remove('io');return}
 sc.classList.add('io');
 ioIn=new IntersectionObserver(es=>{for(const e of es)if(e.isIntersecting){e.target.classList.add('in');ioIn.unobserve(e.target)}},{root:sc,rootMargin:'0px 0px -18% 0px',threshold:0});
 io=new IntersectionObserver(es=>{
  for(const e of es){
   if(!e.isIntersecting)continue;
   const c=e.target,id=c.dataset.id;
   const bar=$('#fprogb'),n=feedList.length;
   if(!id){if(bar)bar.style.width='100%';clearTimeout(dwellT);continue}
   if(bar)bar.style.width=((Number(c.dataset.i)+1)/n*100)+'%';
   clearTimeout(dwellT);
   dwellT=setTimeout(()=>{
    if(!c.querySelector('.pts.hide')){metaOf(id).rd=todayKey();if(!db.read.has(id)){db.read.add(id);const r=c.querySelector('.rd');if(r)r.hidden=false}}
    db.resume=id;persistSoon();
   },Math.max(4000,1500*c.querySelectorAll('.pts li').length));
  }
 },{root:sc,rootMargin:'-45% 0px -45% 0px',threshold:0});
 sc.querySelectorAll('.fcard[data-id]').forEach(c=>{ioIn.observe(c);io.observe(c)});
 const end=sc.querySelector('.fend');if(end)io.observe(end);
}

function tween(el,from,to,fmt=v=>v){

 }

 const ids=new Set(db.items.map(x=>x.id)),m=i=>ids.has(map[i]||i)?(map[i]||i):null;
 (Array.isArray(b.saved)?b.saved:[]).forEach(i=>{const k=m(i);if(k)db.saved.add(k)});
 (Array.isArray(b.seen)?b.seen:[]).forEach(i=>{const k=m(i);if(k)db.seen.add(k)});
 (Array.isArray(b.read)?b.read:[]).forEach(i=>{const k=m(i);if(k)db.read.add(k)});

 for(const k of db.seen)if(!db.srs[k])db.srs[k]={b:1,due:addDays(1),r:0,w:0,l:0};
 const d=legacyDaily(b.daily);
 for(const k of Object.keys(d)){const cur=db.daily[k]?.ids||[];const o=db.daily[k]||{};db.daily[k]={ids:uniq(cur.concat(d[k].ids)),r:Math.max(o.r||0,d[k].r||0),w:Math.max(o.w||0,d[k].w||0)}}
